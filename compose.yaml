# Ambiente do projeto.
#
#   docker compose up -d --build              app em http://localhost:8000 (API em :8010)
#   docker compose run --rm tests             testes de integração do backend
#   docker compose run --rm e2e               testes de ponta a ponta do app (modo local)
#   docker compose down                       para tudo (use -v para apagar os dados)
#
# Variáveis opcionais em .env (veja .env.example).

name: remedios

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-remedios}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-remedios}
      POSTGRES_DB: remedios
    # Só nesta máquina: o banco nunca fica exposto à rede.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18+ guarda os dados em /var/lib/postgresql/<versão>.
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d remedios"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      REMEDIOS_DB_URL: jdbc:postgresql://postgres:5432/remedios
      REMEDIOS_DB_USER: ${POSTGRES_USER:-remedios}
      REMEDIOS_DB_PASSWORD: ${POSTGRES_PASSWORD:-remedios}
      # Firebase Authentication: obrigatório (veja docs/firebase.md).
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      # Chaves públicas do Google que assinam os ID tokens do Firebase.
      # Modo local sem Firebase: troque por /run/keys/test-public.pem no .env
      # e gere tokens com scripts/token-local.sh.
      REMEDIOS_JWT_PUBLICKEY_LOCATION: ${REMEDIOS_JWT_PUBLICKEY_LOCATION:-https://www.googleapis.com/service_accounts/v1/jwk/securetoken@system.gserviceaccount.com}
      # Web Push (lembretes): gere com scripts/vapid-keys.sh. Vazio = sem notificações.
      REMEDIOS_VAPID_PUBLIC_KEY: ${REMEDIOS_VAPID_PUBLIC_KEY:-}
      REMEDIOS_VAPID_PRIVATE_KEY: ${REMEDIOS_VAPID_PRIVATE_KEY:-}
      REMEDIOS_VAPID_SUBJECT: ${REMEDIOS_VAPID_SUBJECT:-mailto:admin@localhost}
      # Catálogo de medicamentos da ANVISA (dados abertos), para sugerir ao digitar.
      # Vazio = desligado; os testes usam a amostra em /run/anvisa/amostra.csv.
      REMEDIOS_ANVISA_URL: ${REMEDIOS_ANVISA_URL-https://dados.anvisa.gov.br/dados/DADOS_ABERTOS_MEDICAMENTOS.csv}
    volumes:
      - ./backend/src/test/resources/publicKey.pem:/run/keys/test-public.pem:ro
      - ./backend/src/test/resources/anvisa-amostra.csv:/run/anvisa/amostra.csv:ro
    # Só nesta máquina: de fora, a API é acessada pelo web (mesma origem).
    ports:
      - "127.0.0.1:${API_PORT:-8010}:8010"
    healthcheck:
      # O Quarkus só abre a porta depois das migrações e da inicialização.
      # 127.0.0.1 (não "localhost"): a API escuta só em IPv4, e "localhost"
      # pode resolver primeiro para ::1 dentro do contêiner.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8010"]
      start_period: 60s
      start_interval: 2s
      interval: 5s
      timeout: 3s
      retries: 20

  # PWA (build estático servido pelo nginx, que repassa /api para a API).
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_AUTH_MODE: ${VITE_AUTH_MODE:-firebase}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8000}:80"

  # Testes de ponta a ponta do PWA contra o serviço web (exige o modo local).
  e2e:
    image: mcr.microsoft.com/playwright:v1.64.1-resolute
    profiles: ["tools"]
    depends_on:
      - web
    # Usa a rede do serviço web: o app abre em http://localhost, origem segura
    # (exigida pelo service worker e pela Web Crypto).
    network_mode: "service:web"
    working_dir: /src
    environment:
      E2E_BASE_URL: http://localhost
    command: ["sh", "-c", "npm ci --no-audit --no-fund --engine-strict=false && npx playwright test"]
    volumes:
      - ./frontend:/src
      - /src/node_modules

  tests:
    image: maven:3-eclipse-temurin-26
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /src
    command: ["mvn", "-B", "verify"]
    environment:
      REMEDIOS_TEST_DB_URL: jdbc:postgresql://postgres:5432/remedios_test
      REMEDIOS_TEST_DB_USER: ${POSTGRES_USER:-remedios}
      REMEDIOS_TEST_DB_PASSWORD: ${POSTGRES_PASSWORD:-remedios}
    volumes:
      - ./backend:/src
      # target/ fica num volume anônimo para não sujar o diretório local.
      - /src/target
      - maven-repo:/root/.m2

volumes:
  postgres-data:
  maven-repo:
