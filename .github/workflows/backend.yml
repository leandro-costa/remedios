name: backend

on:
  push:
    paths: ["backend/**", "docker/**", "compose.yaml", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "docker/**", "compose.yaml", ".github/workflows/backend.yml"]

# O CI usa o mesmo docker compose do desenvolvimento local.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Testes de integração
        run: docker compose run --rm tests
      - name: Imagem da API
        run: docker compose build api
      - name: API sobe e responde
        run: |
          docker compose up -d --wait postgres
          docker compose up -d api
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/q/health/ready && exit 0
            sleep 2
          done
          docker compose logs api
          exit 1
      - if: always()
        run: docker compose down -v
