name: backend

on:
  push:
    paths: ["backend/**", "docker/**", "compose.yaml", "scripts/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "docker/**", "compose.yaml", "scripts/**", ".github/workflows/backend.yml"]

# O CI usa o mesmo docker compose do desenvolvimento local, com a API no modo
# local (chave de teste) para não depender de um projeto Firebase real.
env:
  FIREBASE_PROJECT_ID: remedios-local
  REMEDIOS_JWT_PUBLICKEY_LOCATION: /run/keys/test-public.pem

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Testes de integração
        run: docker compose run --rm tests
      - name: Imagem da API
        run: docker compose build api
      - name: API sobe e responde
        run: |
          docker compose up -d --wait postgres
          docker compose up -d api
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/q/health/ready > /dev/null && break
            sleep 2
          done
          token=$(scripts/token-local.sh ci "CI")
          curl -fsS -H "Authorization: Bearer $token" http://localhost:8080/api/me
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/me)" = 401
      - if: failure()
        run: docker compose logs api
      - if: always()
        run: docker compose down -v
