name: frontend

on:
  push:
    paths: ["frontend/**", "backend/**", "compose.yaml", "scripts/**", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["frontend/**", "backend/**", "compose.yaml", "scripts/**", ".github/workflows/frontend.yml"]

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26.12.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      # Falha com vulnerabilidade alta ou crítica nas dependências do app (fase 5).
      - name: Auditoria das dependências
        run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - name: Build de produção (Firebase) sem a chave de teste
        run: |
          npm run build
          ! grep -rl "PRIVATE KEY" dist

  # O app inteiro pelo docker compose: banco, API e PWA no modo local.
  e2e:
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT_ID: remedios-local
      REMEDIOS_JWT_PUBLICKEY_LOCATION: /run/keys/test-public.pem
      VITE_AUTH_MODE: local
    steps:
      - uses: actions/checkout@v7
      - name: Chaves VAPID descartáveis para o teste
        run: scripts/vapid-keys.sh >> "$GITHUB_ENV"
      - run: docker compose up -d --build --wait postgres api web
      - run: docker compose run --rm e2e
      # Backup e restauração (fase 5): com os dados criados pelo e2e, copia o
      # banco, restaura num banco separado e confere tabela por tabela.
      - name: Teste de restauração do backup
        run: scripts/restore-test.sh --exigir-dados
      - if: failure()
        run: |
          docker compose ps -a
          docker inspect --format '{{json .State.Health}}' remedios-api-1 || true
          docker compose logs api web
      - if: always()
        run: docker compose down -v
