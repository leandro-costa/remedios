# --- Porta HTTP -------------------------------------------------------------
# 8010 (não o padrão 8080, que costuma estar ocupado): o compose, o nginx do
# app, o healthcheck e o CI usam esta porta.
quarkus.http.port=8010

# --- Banco de dados ---------------------------------------------------------
quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=${REMEDIOS_DB_URL}
%prod.quarkus.datasource.username=${REMEDIOS_DB_USER}
%prod.quarkus.datasource.password=${REMEDIOS_DB_PASSWORD}
# Em %dev, sem URL configurada, o Quarkus Dev Services sobe um PostgreSQL via Docker.
%test.quarkus.datasource.jdbc.url=${REMEDIOS_TEST_DB_URL:jdbc:postgresql://localhost:5432/remedios_test}
%test.quarkus.datasource.username=${REMEDIOS_TEST_DB_USER:remedios}
%test.quarkus.datasource.password=${REMEDIOS_TEST_DB_PASSWORD:remedios}

quarkus.flyway.migrate-at-start=true
%test.quarkus.flyway.clean-at-start=true
%test.quarkus.flyway.clean-disabled=false
# O esquema é responsabilidade exclusiva das migrações Flyway.
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.jdbc.timezone=UTC
# JSONB usa um mapeador próprio, independente da serialização da API REST.
quarkus.hibernate-orm.mapping.format.global=ignore

# --- Autenticação: Firebase Authentication ----------------------------------
# O app faz login no Firebase e envia o ID token em "Authorization: Bearer".
# A API valida a assinatura (chaves públicas do Google, renovadas
# automaticamente), o emissor, a audiência (ID do projeto) e a validade.
# A claim "sub" (UID do Firebase) identifica a conta (app_user.auth_subject).
remedios.firebase.project-id=${FIREBASE_PROJECT_ID:}
mp.jwt.verify.issuer=${REMEDIOS_JWT_ISSUER:https://securetoken.google.com/${remedios.firebase.project-id}}
mp.jwt.verify.audiences=${REMEDIOS_JWT_AUDIENCE:${remedios.firebase.project-id}}
mp.jwt.verify.publickey.location=${REMEDIOS_JWT_PUBLICKEY_LOCATION:https://www.googleapis.com/service_accounts/v1/jwk/securetoken@system.gserviceaccount.com}
mp.jwt.verify.publickey.algorithm=RS256

# Dev e testes não dependem do Firebase: tokens no mesmo formato, assinados
# com a chave de TESTE do repositório (nunca use em produção).
%dev.remedios.firebase.project-id=${FIREBASE_PROJECT_ID:remedios-dev}
%dev.mp.jwt.verify.publickey.location=${REMEDIOS_JWT_PUBLICKEY_LOCATION:src/test/resources/publicKey.pem}
%test.remedios.firebase.project-id=remedios-test
%test.mp.jwt.verify.publickey.location=publicKey.pem
%test.smallrye.jwt.sign.key.location=privateKey.pem

# --- Regras do produto ------------------------------------------------------
remedios.invitation.ttl=P7D
# Até quando as doses são geradas antecipadamente (decisão em aberto 3).
remedios.schedule.horizon=P14D
remedios.schedule.extend-every=1h
# Uma dose só pode ser registrada a partir de quanto tempo antes do horário
# previsto (evita registrar por engano a dose de outro dia).
remedios.administration.max-advance=PT6H

# --- Notificações (Web Push) -----------------------------------------------
# Chaves VAPID geradas com scripts/vapid-keys.sh. Sem elas, o push fica desligado.
remedios.push.vapid.public-key=${REMEDIOS_VAPID_PUBLIC_KEY:}
remedios.push.vapid.private-key=${REMEDIOS_VAPID_PRIVATE_KEY:}
remedios.push.vapid.subject=${REMEDIOS_VAPID_SUBJECT:mailto:admin@localhost}
remedios.reminders.every=1m
remedios.outbox.every=15s
# Lembrete atrasado além disso (ex.: servidor parado) não é enviado fora de hora.
remedios.reminders.max-delay=PT15M
# Duração do "Estou cuidando desta dose".
remedios.reminders.claim=PT20M
# Par de TESTE (não use em produção) e endpoints HTTP do servidor de push falso.
%test.remedios.push.allow-insecure-endpoints=true
%test.remedios.push.vapid.public-key=BJM6_b3tWJExAcCWFUa-8IfFTY0hl3eFaQmNVhtN5xxAooiEYWu6vZzAz3oyoM7ppxni_GT6r6i8ofyRH7xyjVk
%test.remedios.push.vapid.private-key=7CEAxshMB4lYOvHYIa7R1ODQiHV36Bkue34aZBLEvn8

# Nos testes o job não roda sozinho; os testes chamam o serviço diretamente.
%test.quarkus.scheduler.enabled=false

# Pedidos são JSON pequenos; o nginx também limita (defesa em profundidade).
quarkus.http.limits.max-body-size=256K
