# --- Banco de dados ---------------------------------------------------------
quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=${REMEDIOS_DB_URL}
%prod.quarkus.datasource.username=${REMEDIOS_DB_USER}
%prod.quarkus.datasource.password=${REMEDIOS_DB_PASSWORD}
# Em %dev, sem URL configurada, o Quarkus Dev Services sobe um PostgreSQL via Docker.
%test.quarkus.datasource.jdbc.url=${REMEDIOS_TEST_DB_URL:jdbc:postgresql://localhost:5432/remedios_test}
%test.quarkus.datasource.username=${REMEDIOS_TEST_DB_USER:remedios}
%test.quarkus.datasource.password=${REMEDIOS_TEST_DB_PASSWORD:remedios}

quarkus.flyway.migrate-at-start=true
%test.quarkus.flyway.clean-at-start=true
%test.quarkus.flyway.clean-disabled=false
# O esquema é responsabilidade exclusiva das migrações Flyway.
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.jdbc.timezone=UTC
# JSONB usa um mapeador próprio, independente da serialização da API REST.
quarkus.hibernate-orm.mapping.format.global=ignore

# --- Autenticação -----------------------------------------------------------
# Qualquer provedor que emita JWT assinado (decisão em aberto 1). A claim
# "sub" identifica a conta (app_user.auth_subject).
mp.jwt.verify.issuer=${REMEDIOS_JWT_ISSUER:https://remedios.local/dev}
%prod.mp.jwt.verify.publickey.location=${REMEDIOS_JWT_PUBLICKEY_LOCATION}
%dev.mp.jwt.verify.publickey.location=src/test/resources/publicKey.pem
%test.mp.jwt.verify.publickey.location=publicKey.pem
%test.smallrye.jwt.sign.key.location=privateKey.pem

# --- Regras do produto ------------------------------------------------------
remedios.invitation.ttl=P7D
