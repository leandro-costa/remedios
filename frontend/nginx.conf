# PWA e API na mesma origem: sem CORS, e o service worker cobre só o app.

# Limite de pedidos por endereço na API (seção 12): folgado para uma casa
# inteira (vários celulares saem pelo mesmo IP e o app faz rajadas ao abrir),
# corta abusos e tentativas em massa. Atrás de um proxy reverso, todos os
# clientes podem chegar com o mesmo IP; nesse caso, ajuste ou use real_ip.
limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    # Pedidos da API são pequenos (JSON); nada de uploads grandes.
    client_max_body_size 256k;
    include /etc/nginx/security-headers.conf;

    location /api/ {
        limit_req zone=api burst=300 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Arquivos com hash no nome: cache longo.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Service worker e manifesto sempre revalidados, para atualizações chegarem.
    location ~ ^/(sw\.js|workbox-.*\.js|index\.html)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.html;
    }
}
