# Cabeçalhos de segurança do app (seção 12). Incluído em cada location: no
# nginx, uma location com add_header próprio não herda os do server.
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy same-origin always;
add_header X-Frame-Options DENY always;
# Ignorado pelos navegadores em HTTP; vale quando o app é servido por HTTPS.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
# Login do Google pelo Firebase abre um popup: precisa manter a referência a ele.
add_header Cross-Origin-Opener-Policy same-origin-allow-popups always;
# Só o próprio app; o login do Firebase usa domínios do Google (apis.google.com,
# *.googleapis.com, *.firebaseapp.com). Nenhum script ou estilo inline.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://apis.google.com https://www.gstatic.com; style-src 'self'; img-src 'self' data: https://*.googleusercontent.com; connect-src 'self' https://*.googleapis.com; frame-src https://*.firebaseapp.com https://*.web.app https://accounts.google.com; worker-src 'self'; manifest-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
